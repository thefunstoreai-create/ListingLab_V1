<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Create Project</title>
</head>
<body>
<h1>Create Project</h1>

<form action="/projects" method="post" th:object="${project}">
    <div>
        <label>Project Name</label>
        <input type="text" th:field="*{projectName}" />
    </div>

    <div>
        <label>Product Name</label>
        <input type="text" th:field="*{productName}" />
    </div>

    <div>
        <label>Category</label>
        <select th:field="*{productCategory}">
            <option th:each="c : ${categories}" th:value="${c}" th:text="${c}"></option>
        </select>
    </div>

    <div>
        <label>Style</label>
        <select th:field="*{stylePreset}">
            <option th:each="s : ${styles}" th:value="${s}" th:text="${s}"></option>
        </select>
    </div>

    <div>
        <label>Notes</label>
        <textarea th:field="*{notes}"></textarea>
    </div>

    <button type="submit">Create</button>
</form>
</body>
</html>
