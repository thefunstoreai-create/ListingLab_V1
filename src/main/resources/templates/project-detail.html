<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Project Detail</title>
    <style>
        .thumb-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            margin-top: 16px;
        }

        .thumb-card {
            border: 1px solid #ccc;
            padding: 10px;
            width: 220px;
        }

        .thumb-card img {
            width: 200px;
            height: 200px;
            object-fit: cover;
            display: block;
            margin-bottom: 8px;
            border: 1px solid #ddd;
        }

        .filename {
            font-size: 14px;
            word-break: break-word;
        }
    </style>
</head>
<body>

<h1 th:text="${project.projectName}"></h1>

<p><strong>Product:</strong> <span th:text="${project.productName}"></span></p>
<p><strong>Category:</strong> <span th:text="${project.productCategory}"></span></p>
<p><strong>Style:</strong> <span th:text="${project.stylePreset}"></span></p>
<p><strong>Notes:</strong> <span th:text="${project.notes}"></span></p>

<h2>Upload Reference Image</h2>
<form th:action="@{'/projects/' + ${project.id} + '/upload'}" method="post" enctype="multipart/form-data">
    <input type="file" name="files" accept="image/*" multiple required />
    <button type="submit">Upload</button>
</form>

<h2>Reference Images</h2>

<div th:if="${#lists.isEmpty(referenceImages)}">
    <p>No reference images uploaded yet.</p>
</div>

<div class="thumb-grid" th:if="${!#lists.isEmpty(referenceImages)}">
    <div class="thumb-card" th:each="img : ${referenceImages}">
        <img th:src="${img.webPath}" th:alt="${img.originalFilename}" />
        <div class="filename" th:text="${img.originalFilename}"></div>
    </div>
</div>

</body>
</html>
